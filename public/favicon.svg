<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ECAC8"/>
      <stop offset="55%" stop-color="#3A8DA3"/>
      <stop offset="100%" stop-color="#1C4E68"/>
    </linearGradient>
    <linearGradient id="rFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E6F7F6"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C6ECEB" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#C6ECEB" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形（app icon shape） -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- 中心垂直主干（从上到下，叶→枝→干→R） -->
  <g transform="translate(256, 256)">
    <!-- 分支：分叉结构 -->
    <g stroke="url(#branch)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95">
      <!-- 主干 上半段 -->
      <line x1="0" y1="-120" x2="0" y2="20"/>
      <!-- 第1层分叉（顶端） -->
      <line x1="0" y1="-120" x2="-90" y2="-170"/>
      <line x1="0" y1="-120" x2="90" y2="-170"/>
      <line x1="0" y1="-120" x2="-30" y2="-175"/>
      <line x1="0" y1="-120" x2="30" y2="-175"/>
      <!-- 第2层分叉 -->
      <line x1="0" y1="-70" x2="-130" y2="-110"/>
      <line x1="0" y1="-70" x2="130" y2="-110"/>
      <line x1="0" y1="-70" x2="-70" y2="-125"/>
      <line x1="0" y1="-70" x2="70" y2="-125"/>
      <!-- 第3层分叉（靠近R顶部） -->
      <line x1="0" y1="-20" x2="-160" y2="-55"/>
      <line x1="0" y1="-20" x2="160" y2="-55"/>
      <line x1="0" y1="-20" x2="-100" y2="-75"/>
      <line x1="0" y1="-20" x2="100" y2="-75"/>
      <!-- 主干小圆点（分叉连接点） -->
    </g>

    <!-- 分叉连接点 -->
    <g fill="#C6ECEB">
      <circle cx="0" cy="-120" r="3.6" opacity="0.95"/>
      <circle cx="0" cy="-105" r="3.2" opacity="0.9"/>
      <circle cx="0" cy="-90" r="3.2" opacity="0.9"/>
      <circle cx="0" cy="-70" r="3.6" opacity="0.95"/>
      <circle cx="0" cy="-55" r="3.2" opacity="0.9"/>
      <circle cx="0" cy="-40" r="3.2" opacity="0.9"/>
      <circle cx="0" cy="-20" r="3.6" opacity="0.95"/>
      <circle cx="0" cy="-5" r="3.2" opacity="0.9"/>
      <circle cx="0" cy="10" r="3.2" opacity="0.9"/>
    </g>

    <!-- 叶子（叶片形） -->
    <g fill="#D8F1F1" opacity="0.94">
      <!-- 顶端叶 -->
      <path d="M -90,-170 Q -102,-188 -85,-195 Q -73,-182 -90,-170 Z"/>
      <path d="M 90,-170  Q 102,-188  85,-195 Q 73,-182  90,-170 Z"/>
      <path d="M -30,-175 Q -30,-200 -10,-203 Q -12,-180 -30,-175 Z"/>
      <path d="M  30,-175 Q  30,-200  10,-203 Q  12,-180  30,-175 Z"/>

      <!-- 第2层叶 -->
      <path d="M -130,-110 Q -155,-118 -150,-140 Q -126,-134 -130,-110 Z"/>
      <path d="M  130,-110 Q  155,-118  150,-140 Q  126,-134  130,-110 Z"/>
      <path d="M -70,-125 Q -90,-138 -78,-150 Q -62,-140 -70,-125 Z"/>
      <path d="M  70,-125 Q  90,-138  78,-150 Q  62,-140  70,-125 Z"/>

      <!-- 第3层叶 -->
      <path d="M -160,-55 Q -190,-58 -186,-86 Q -158,-78 -160,-55 Z"/>
      <path d="M  160,-55 Q  190,-58  186,-86 Q  158,-78  160,-55 Z"/>
      <path d="M -100,-75 Q -124,-85 -116,-105 Q -92,-96  -100,-75 Z"/>
      <path d="M  100,-75 Q  124,-85  116,-105 Q  92,-96   100,-75 Z"/>

      <!-- 额外点缀叶 -->
      <path d="M -130,-50 Q -150,-40 -140,-22 Q -118,-32 -130,-50 Z"/>
      <path d="M  130,-50 Q  150,-40  140,-22 Q  118,-32  130,-50 Z"/>
    </g>

    <!-- 字母叶片上的字母（淡色，点缀） -->
    <g font-family="serif" font-size="18" font-weight="700" fill="#234F5E" opacity="0.78" text-anchor="middle">
      <!-- 只加少量字母做点缀，避免过乱 -->
      <text x="-88" y="-182">W</text>
      <text x="88"  y="-182">A</text>
      <text x="-28" y="-190">S</text>
      <text x="28"  y="-190">E</text>
      <text x="-128" y="-126">J</text>
      <text x="128"  y="-126">I</text>
      <text x="-68"  y="-142">R</text>
      <text x="68"   y="-142">D</text>
      <text x="-158" y="-72">R</text>
      <text x="158"  y="-72">O</text>
      <text x="-98"  y="-94">E</text>
      <text x="98"   y="-94">S</text>
      <text x="-128" y="-38">T</text>
      <text x="128"  y="-38">E</text>
    </g>

    <!-- 中央叶子圆形字母（中心装饰） -->
    <g>
      <circle cx="-64" cy="-94" r="13" fill="#ffffff" opacity="0.72"/>
      <text x="-64" y="-88" font-family="serif" font-size="16" font-weight="700" fill="#3A8DA3" text-anchor="middle">R</text>

      <circle cx="64" cy="-94" r="13" fill="#ffffff" opacity="0.72"/>
      <text x="64" y="-88" font-family="serif" font-size="16" font-weight="700" fill="#3A8DA3" text-anchor="middle">D</text>

      <circle cx="0" cy="-156" r="14" fill="#ffffff" opacity="0.75"/>
      <text x="0" y="-150" font-family="serif" font-size="17" font-weight="700" fill="#3A8DA3" text-anchor="middle">W</text>
    </g>
  </g>

  <!-- 字母 R 作树干（底部） -->
  <g transform="translate(256, 408)" filter="url(#glow)">
    <!-- 用粗体无衬线 R 做树干 -->
    <text
      x="0"
      y="0"
      text-anchor="middle"
      dominant-baseline="auto"
      font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
      font-size="168"
      font-weight="900"
      fill="url(#rFill)"
      letter-spacing="-2"
    >R</text>
  </g>
</svg>
