<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="description" content="RecurWords · 用英文解释英文，递归理解直至掌握；答错自动入错题库。" />
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#a78bfa" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RecurWords" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>RecurWords · 递归式英文词汇学习</title>
    <!-- 百度统计（UV/PV/用户分布） https://tongji.baidu.com -->
    <!-- 兼容两种场景：
         1. 浏览器 https:// 打开（GitHub Pages / 本地预览）→ 自动读取 location 上报
         2. 安卓 APP file:///android_asset 打开（Capacitor WebView）→ 手动指定虚拟 URL，避免 file:// 协议被百度拒收
    -->
    <script>
      var _hmt = _hmt || [];
      // 关键：file:// 协议下必须提前 setAutoPageview=false，再 _trackPageview(虚拟URL)
      if (location.protocol === 'file:') {
        _hmt.push(['_setAutoPageview', false]);
      }
      (function () {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?3cf70fe126a4cbadaf67fb11b66ff944";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
        hm.onload = function () {
          if (location.protocol === 'file:') {
            // 用一个假的 HTTP URL 上报，百度后台才能看到正常的 PV
            var fakeUrl = 'https://recurwords.app/android/' + (location.hash || '').replace(/^#/, '') || 'home';
            _hmt.push(['_trackPageview', fakeUrl]);
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
