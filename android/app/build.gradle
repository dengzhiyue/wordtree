plugins {
    id 'com.android.application'
}

android {
    namespace 'com.recurwords.app'
    compileSdk rootProject.compileSdkVersion

    defaultConfig {
        applicationId "com.recurwords.app"
        minSdk rootProject.minSdkVersion
        targetSdk rootProject.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

def capacitorAndroid = (String) project.hasProperty('capacitorAndroid') ? project.property('capacitorAndroid') : null

repositories {
    flatDir {
        dirs 'libs'
    }
    maven {
        url "https://jitpack.io"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "com.google.android.material:material:$androidxMaterialVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.browser:browser:$androidxBrowserVersion"

    implementation project(':capacitor-android')
    implementation "androidx.exifinterface:exifinterface:$androidxExifInterfaceVersion"

    implementation 'com.getcapacitor:status-bar:6.0.0'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoVersion"
}

// Keep Gradle sync working even if Capacitor hasn't been synced locally.
tasks.whenTaskAdded { task ->
    if (task.name == 'mergeDebugResources' || task.name == 'mergeReleaseResources') {
        task.doFirst {
            def dir = file("$projectDir/src/main/assets/public")
            if (!dir.exists()) {
                dir.mkdirs()
                new File(dir, "index.html").text = "<html><body><p>Syncing web assets…</p></body></html>"
            }
        }
    }
}
