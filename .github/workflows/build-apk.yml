name: Build RecurWords Android (APK · debug · free)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17 (Temurin · AGP 8.x requires JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets (Vite dist/)
        run: npm run build

      - name: Build 100% fresh android/ via Capacitor official CLI (zero repo android files reused)
        id: cap
        run: |
          # CI STRATEGY: NEVER reuse android/ from the repo checkout.
          # Our repo's android/ was generated on Windows with a different Capacitor version and
          # is INCOMPLETE (missing gradlew / gradle-wrapper.jar) + CONTAINS OLD FILES that pollute
          # fresh builds (caused 2 distinct bugs: MissingPropertyException 'capacitorAndroid' and
          # MergeResources Duplicate resources 'AppTheme.NoActionBar').
          #
          # The correct approach in CI: always start from zero. capacitor.config.ts already
          # declares appId, appName, statusBar color, server scheme, server hostname — all
          # customizations needed for Android. `npx cap sync android` writes them into the
          # brand-new project automatically, so no manual git-checkout restore is required.
          set -e
          echo "=== Wiping repo-provided android/ (if any) to guarantee a clean rebuild ==="
          rm -rf android
          echo "=== npx cap add android  (templates from installed @capacitor/android — version-matched) ==="
          npx cap add android
          echo "=== npx cap sync android  (writes capacitor.config.ts → Android configs) ==="
          npx cap sync android
          # Sanity: gradlew must exist + be executable
          if [ ! -x "android/gradlew" ]; then
            echo "ERROR: android/gradlew missing after fresh add. Listing android/:"
            ls -la android android/gradle android/gradle/wrapper 2>&1 || true
            exit 1
          fi
          echo ""
          echo "=== Capacitor-owned build system — gradlew, wrapper, pinned Gradle version ==="
          ls -la android/gradlew
          echo "--- gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties

      # NOTE: gradle/actions/setup-gradle@v4 is ONLY a caching / Gradle-home setup step.
      # It NO LONGER accepts `arguments` (deprecated) or `build-root-directory` (not a valid input).
      # The actual Gradle build MUST be done in a separate `run:` step via the project's own
      # ./gradlew (which Capacitor just generated above), so the Gradle distribution version
      # (declared in android/gradle/wrapper/gradle-wrapper.properties) is 100% matched to
      # the project's AGP version — eliminating any "system Gradle vs project Gradle" mismatch.
      - name: (cache-only) Wire Gradle build cache via official setup-gradle@v4
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ runner.os }}-gradle-enc

      - name: Build debug APK with ./gradlew assembleDebug (project-owned wrapper)
        run: |
          set -e
          chmod +x android/gradlew || true
          echo "=== gradle-wrapper.properties (pinned version, no system Gradle involved) ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo ""
          cd android
          export GRADLE_OPTS="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          ./gradlew --version
          echo ""
          echo "=== Running assembleDebug (wrapper-owned Gradle version above) ==="
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo ""
          echo "=== APK outputs ==="
          ls -lh app/build/outputs/apk/debug/ 2>&1 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: recurwords-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/output-metadata.json
          retention-days: 30
          if-no-files-found: error
