name: Build RecurWords Android (APK · debug · free)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17 (Temurin · AGP 8.x requires JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets (Vite dist/)
        run: npm run build

      - name: Ensure android platform is present & sync web assets
        id: cap
        run: |
          if [ -d "android/app/src/main" ]; then
            echo "android/ skeleton present, running sync only"
            npx cap sync android
          else
            echo "android/ missing, adding platform and syncing"
            npx cap add android
          fi

      - name: Ensure Gradle wrapper exists (auto rebuild if missing on Windows-hosted repos)
        working-directory: android
        run: |
          if [ -x ./gradlew ]; then
            echo "gradlew OK (executable)"
            exit 0
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "gradlew OK (chmod +x applied)"
            exit 0
          fi
          echo "gradlew missing — regenerating wrapper with global Gradle (gradle-wrapper.properties already pinned version)"
          WRAPPER_PROPS=gradle/wrapper/gradle-wrapper.properties
          if [ -f "$WRAPPER_PROPS" ]; then
            VER=$(grep -Eo 'gradle-[0-9.]+-bin' "$WRAPPER_PROPS" | head -n1 | sed -E 's/gradle-([0-9.]+)-bin/\1/')
          fi
          if [ -z "$VER" ]; then
            VER="8.7"
          fi
          echo "Using Gradle version: $VER"
          which gradle || (apt-get update && apt-get install -y gradle) || true
          gradle wrapper --gradle-version "$VER"
          chmod +x ./gradlew
          ls -la gradle/wrapper gradlew || true

      - name: Build debug APK with Gradle + assembleDebug
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
          cache-encryption-key: ${{ runner.os }}-gradle-enc
          arguments: --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: recurwords-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/output-metadata.json
          retention-days: 30
          if-no-files-found: error
