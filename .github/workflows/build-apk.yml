name: Build RecurWords Android (APK · debug · free)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17 (Temurin · AGP 8.x requires JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets (Vite dist/)
        run: npm run build

      - name: (Re)build android/ via Capacitor official CLI (guarantees complete Gradle wrapper)
        id: cap
        run: |
          # Only reuse existing android/ if it contains a COMPLETE Gradle wrapper (gradlew + wrapper jar).
          # If anything is missing (common in Windows-hosted repos that never ran Android Studio),
          # wipe it and let @capacitor/android regenerate a full, version-matched project.
          REUSE_OK=1
          [ -x "android/gradlew" ] || REUSE_OK=0
          [ -f "android/gradle/wrapper/gradle-wrapper.jar" ] || REUSE_OK=0
          if [ "$REUSE_OK" = "1" ]; then
            echo "android/ has complete Gradle wrapper — running sync only"
            npx cap sync android
          else
            echo "android/ incomplete or missing — regenerating via \`npx cap add android\` (pulls templates from installed @capacitor/android)"
            rm -rf android
            npx cap add android
            npx cap sync android
            # Restore ONLY user-authored Android customizations committed to this repo:
            #   - AndroidManifest.xml (package name, permissions, intents)
            #   - MainActivity.java / Kotlin main class
            #   - launcher icons, splash, colors, strings (res/)
            #   - assets/ (copied-in binaries, fonts, etc.)
            # WE EXPLICITLY REFUSE TO RESTORE ANY GRADLE BUILD FILES:
            #   - android/build.gradle, android/app/build.gradle, android/settings.gradle
            #   - android/gradle/wrapper/*, android/gradlew, android/gradlew.bat
            #   - android/variables.gradle
            # These must come 100% from `npx cap add android` so the Gradle distribution,
            # AGP (Android Gradle Plugin) version, and Capacitor runtime (capacitor-android
            # plugin + capacitorAndroid property injection) are perfectly in sync.
            # Mixing repo-tracked old build scripts with fresh Capacitor output caused:
            #   MissingPropertyException: Could not get unknown property 'capacitorAndroid'
            echo "Re-applying repo-tracked Android SOURCE customizations (build scripts left untouched)"
            git checkout HEAD -- \
              android/app/src/main/ \
              android/gradle.properties \
              2>/dev/null || true
            # Sync once more because custom AndroidManifest / assets may tweak capacitor outputs
            npx cap sync android
          fi
          # Sanity: gradlew must now exist + be executable
          if [ ! -x "android/gradlew" ]; then
            echo "ERROR: android/gradlew is still missing after regeneration. Listing android/:"
            ls -la android android/gradle android/gradle/wrapper 2>&1 || true
            exit 1
          fi
          echo "android/gradlew ready — $(ls -la android/gradlew)"

      # NOTE: gradle/actions/setup-gradle@v4 is ONLY a caching / Gradle-home setup step.
      # It NO LONGER accepts `arguments` (deprecated) or `build-root-directory` (not a valid input).
      # The actual Gradle build MUST be done in a separate `run:` step via the project's own
      # ./gradlew (which Capacitor just generated above), so the Gradle distribution version
      # (declared in android/gradle/wrapper/gradle-wrapper.properties) is 100% matched to
      # the project's AGP version — eliminating any "system Gradle vs project Gradle" mismatch.
      - name: (cache-only) Wire Gradle build cache via official setup-gradle@v4
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ runner.os }}-gradle-enc

      - name: Build debug APK with ./gradlew assembleDebug (project-owned wrapper)
        run: |
          set -e
          chmod +x android/gradlew || true
          echo "=== gradle-wrapper.properties (pinned version, no system Gradle involved) ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo ""
          cd android
          export GRADLE_OPTS="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          ./gradlew --version
          echo ""
          echo "=== Running assembleDebug (wrapper-owned Gradle version above) ==="
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo ""
          echo "=== APK outputs ==="
          ls -lh app/build/outputs/apk/debug/ 2>&1 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: recurwords-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/output-metadata.json
          retention-days: 30
          if-no-files-found: error
